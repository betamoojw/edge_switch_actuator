site_name: Switching Actuator

nav:
  - Home: index.md
  - "Switching Actuator Design":
      - actuator-production-design.md
      - Implementation and validation: actuator-implementation.md
      - Network API migration: network-api-migration.md
      - Home Assistant: home-assistant.md
      - Xiaozhi MCP: xiaozhi-mcp.md
      - actuator-source-review.md
      - esp32-s3-relay-6ch-hardware.md
      - actuator-modbus-map.md
      - actuator-knx-design.md
      - Modbus verifier quick start: modbus-verifier-quickstart.md
      - Modbus verification and validation: MODBUS_VERIFICATION_VALIDATION_PLAN.md
  - "Build Tools":
      - gettingstarted.md
      - buildprocess.md
      - Credentials and label quick start: device-credentials.md
  - "Front End":
      - sveltekit.md
      - structure.md
      - KNX address entry: knx-address-entry.md
      - Development and testing: frontend-testing.md
      - stores.md
      - components.md
  - "Back End":
      - statefulservice.md
      - restfulapi.md

site_author: elims
site_description: >-
  ESP32-S3 Switching Actuator: six relay outputs, Protocol Interface configuration, and a responsive device management interface.

# Repository
repo_name: theelims/ESP32-sveltekit
repo_url: https://github.com/theelims/ESP32-sveltekit

theme:
  name: material
  logo: media/svelte-logo.png
  favicon: media/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: blue
      accent: blue

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: indigo
      accent: indigo

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.follow
    - toc.integrate
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/theelims/
    - icon: fontawesome/brands/discord
      link: https://discord.gg/MTn9mVUG5n
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

copyright: |
  Copyright &copy; 2025 by <a href="https://github.com/theelims"  target="_blank" rel="noopener">elims</a> -
  <a href="#__consent">Change cookie settings</a>
