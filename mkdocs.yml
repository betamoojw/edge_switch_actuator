site_name: Edge Switching Actuator
site_url: https://betamoojw.github.io/edge_switch_actuator/
site_description: Six-channel ESP32-S3 relay actuator — setup, protocols, architecture, API and development.
repo_name: betamoojw/edge_switch_actuator
repo_url: https://github.com/betamoojw/edge_switch_actuator
edit_uri: edit/dev/docs/

nav:
  - Overview: index.md
  - Release notes: release-notes.md
  - User guide:
      - Your first session: quick-start.md
      - Interface tour: interface-tour.md
      - Device operation: device-operation.md
      - Troubleshooting and recovery: troubleshooting.md
      - Credentials and setup labels: device-credentials.md
      - UI preferences: ui-preferences.md
      - Hardware reference: esp32-s3-relay-6ch-hardware.md
      - Commissioning acceptance: commissioning.md
  - Protocols and integrations:
      - Choose an integration: integrations.md
      - Modbus register map: actuator-modbus-map.md
      - Modbus verifier: modbus-verifier-quickstart.md
      - KNX commissioning: knx-address-entry.md
      - Home Assistant: home-assistant.md
      - Xiaozhi MCP: xiaozhi-mcp.md
  - Development:
      - Set up and build: gettingstarted.md
      - Architecture: architecture.md
      - Build and firmware updates: buildprocess.md
      - REST and events: restfulapi.md
      - Frontend structure: structure.md
      - SvelteKit and theming: sveltekit.md
      - Frontend testing: frontend-testing.md
      - Stores: stores.md
      - Components: components.md
      - Framework services: statefulservice.md
      - Code style: code-style.md
      - Contributing: contributing.md
      - Documentation publishing: documentation.md
  - Review and validation:
      - Current dev review: actuator-source-review.md
      - TCP acceptance procedure: modbus-tcp-relay-fat-sat.md
      - RTU acceptance procedure: modbus-rtu-relay-fat-sat.md
  - Historical records (original language):
      - Live device inspection: live-verification.md
      - Validation record: validation.md
      - Previous source review: source-review-2026-10-10.md
      - KNX design history: actuator-knx-design.md
      - Implementation history: actuator-implementation.md
      - Network API migration: network-api-migration.md
      - Modbus validation plan: MODBUS_VERIFICATION_VALIDATION_PLAN.md
      - Frontend test plan: FRONTEND_HARDWARE_INDEPENDENT_TEST_PLAN.md
      - Original design: actuator-production-design.md
      - Framework tutorial archive: framework-tutorial-legacy.md

theme:
  name: material
  icon:
    logo: material/electric-switch
    repo: fontawesome/brands/github
  favicon: media/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - scripts/docs_hook.py

plugins:
  - search:
      lang: [en, zh]
      separator: '[\s\-\u200b]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          theme:
            language: zh
            palette:
              - scheme: default
                primary: teal
                accent: teal
                toggle:
