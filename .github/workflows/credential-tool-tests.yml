name: Device credential tool tests
on:
  pull_request:
    paths: ['scripts/get_device_credentials.py', 'scripts/requirements-credentials.txt', 'tests/test_device_credentials.py', '.github/workflows/credential-tool-tests.yml']
  push:
    branches: [dev, main]
    paths: ['scripts/get_device_credentials.py', 'scripts/requirements-credentials.txt', 'tests/test_device_credentials.py', '.github/workflows/credential-tool-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-credentials.txt zxing-cpp==2.3.0
      - run: python -m unittest discover -s tests -p test_device_credentials.py -v
